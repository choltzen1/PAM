{% extends 'base.html' %}
{% block title %}Data Management - PAM{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/admin.css">{% endblock %}
{% block content %}
<div class="admin-subpage">
  <div class="subpage-header">
    <h2><i class="fas fa-database"></i> Data Management</h2>
    <a class="breadcrumb-link" href="/admin"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  </div>
  <p class="subpage-intro">Backup data, run full refresh, inspect date quality diagnostics, and view PCR version statistics.</p>
  <div class="admin-subgrid">
    <button class="btn-admin" onclick="backupData()"><i class="fas fa-download"></i> Backup Now</button>
    <button class="btn-admin" onclick="dataRefresh()"><i class="fas fa-database"></i> Full Data Refresh</button>
    <button class="btn-admin" onclick="loadDateDiagnostics()"><i class="fas fa-calendar-times"></i> Date Diagnostics</button>
    <button class="btn-admin" onclick="loadPcrStats()"><i class="fas fa-flask"></i> PCR Stats</button>
  </div>
  <div id="data-output" class="admin-output"></div>
</div>
<script>
function showOutput(text){document.getElementById('data-output').textContent=text;}
function backupData(){fetch('/admin/backup',{method:'POST'}).then(r=>r.json()).then(d=>showOutput(JSON.stringify(d,null,2)));}
function dataRefresh(){fetch('/admin/data-refresh',{method:'POST'}).then(r=>r.json()).then(d=>showOutput(JSON.stringify(d,null,2)));}
function loadDateDiagnostics(){fetch('/admin/date-diagnostics').then(r=>r.json()).then(d=>showOutput(JSON.stringify(d,null,2)));}
function loadPcrStats(){fetch('/admin/pcr-stats').then(r=>r.json()).then(d=>showOutput(JSON.stringify(d,null,2)));}
</script>
{% endblock %}
