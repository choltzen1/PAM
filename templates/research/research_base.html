<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Research Workspace{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/research.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pete.css') }}">
  <style>
     /* Theme switcher styles (unique to research workspace) */
    .theme-toggle-group { display:flex; gap:.55rem; align-items:center; }
    .theme-switch { position:relative; width:70px; height:30px; border-radius:24px; background:var(--control-surface); border:1px solid var(--border-color); cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:0 8px; box-sizing:border-box; transition:background .35s,border-color .35s, box-shadow .35s; }
    .theme-switch[data-state='dark'] { background:rgba(34,37,46,0.55); backdrop-filter:blur(4px); }
    .theme-switch[data-state='light'] { background:#fafafa; }
    .theme-switch[data-state='dark'] .theme-switch-indicator { transform:translateX(38px); }
    .theme-switch[data-state='light'] .theme-switch-indicator { transform:translateX(0); }
    .theme-switch-indicator { position:absolute; top:3px; left:3px; width:28px; height:24px; border-radius:16px; background:var(--tmobile-magenta); box-shadow:0 3px 8px rgba(0,0,0,.35); transition:transform .4s cubic-bezier(.55,.15,.25,1); display:flex; align-items:center; justify-content:center; color:#fff; font-size:.8rem; font-weight:600; letter-spacing:.5px; }
    .theme-switch .icon { font-size:.65rem; font-weight:600; letter-spacing:.5px; color:var(--text-muted); user-select:none; }
    .theme-switch:focus-visible { outline:2px solid var(--tmobile-magenta); outline-offset:2px; }
  </style>
  {% block extra_css %}{% endblock %}
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
    /* Early theme (no-flash) */
    (function(){
      try {
        const stored = localStorage.getItem('pam_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let apply = 'light';
        if(stored === 'dark' || stored === 'light') apply = stored; else apply = prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', apply);
      } catch(e) { /* silent */ }
    })();
  </script>
  {% block head %}{% endblock %}
  <style>
    html, body { height:100%; }
    body { display:flex; flex-direction:column; margin:0; }
    .hub-main { flex:1 0 auto; width:100%; }
    .global-header { background:var(--tmobile-magenta); color:#fff; padding:.75rem 1.75rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 4px rgba(0,0,0,.15); }
    .global-header-title { font-size:1.25rem; font-weight:600; letter-spacing:.5px; }
    .global-header-user { font-size:.85rem; opacity:.9; display:flex; align-items:center; gap:1rem; }
    .footer-bar { flex-shrink:0; background:var(--tmobile-magenta); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:.5em 2em; font-size:1rem; height:60px; box-sizing:border-box; }
  </style>
 </head>
 <body class="body-fixed-header-footer">
   <header class="global-header">
    <div class="global-header-title">{% block header_left %}Research Workspace{% endblock %}</div>
    <div class="global-header-user">
      <div class="theme-toggle-group">
        <div class="theme-switch" id="themeSwitch" tabindex="0" role="button" aria-label="Toggle light/dark theme">
          <span class="icon">L</span>
          <span class="icon">D</span>
          <div class="theme-switch-indicator" id="themeIndicator">L</div>
        </div>
      </div>
      {% block header_right %}{% endblock %}
    </div>
   </header>
  <main class="app-main-scroll" style="padding-top:calc(var(--header-height) + var(--header-content-gap));padding-bottom:var(--footer-height);">
     {% block content %}{% endblock %}
   </main>
  <footer class="footer-nav" style="background:var(--tmobile-magenta);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0.5em 2em;font-size:1rem;height:var(--footer-height);box-sizing:border-box;position:fixed;bottom:0;left:0;right:0;z-index:1000;">
    <div id="footer-time">{{ current_datetime }}</div>
    <nav class="footer-links" style="display:flex;gap:1.5em;align-items:center;">
      <a title="Back" href="javascript:history.back()" style="color:#fff;text-decoration:none;font-size:1.2em;"><i class="fas fa-chevron-left"></i></a>
      <a title="Workspace Hub" href="{{ url_for('core.landing') }}" style="color:#fff;text-decoration:none;font-size:1.2em;"><i class="fas fa-th-large"></i></a>
  <a title="Research Home" href="{{ url_for('research.index') }}" style="color:#fff;text-decoration:none;font-size:1.2em;"><i class="fas fa-home"></i></a>
    </nav>
   </footer>
  <script>
    function updateFooterTime(){const el=document.getElementById('footer-time');if(!el)return;const now=new Date();const opts={weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'};el.textContent=now.toLocaleString('en-US',opts);}setInterval(updateFooterTime,1000);updateFooterTime();
    (function(){
      const switchEl = document.getElementById('themeSwitch');
      const indicator = document.getElementById('themeIndicator');
      if(!switchEl) return;
      function apply(mode){
        const resolved = mode === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
        localStorage.setItem('pam_theme', resolved);
        fetch('/theme', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'mode='+encodeURIComponent(resolved)}).catch(()=>{});
        switchEl.dataset.state = resolved;
        indicator.textContent = resolved === 'dark' ? 'D' : 'L';
      }
      function toggle(){
        const current = localStorage.getItem('pam_theme') || '{{ server_theme|default("light") }}';
        const next = current === 'light' ? 'dark' : 'light';
        apply(next);
      }
      switchEl.addEventListener('click', toggle);
      switchEl.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(); }});
      const initialRaw = localStorage.getItem('pam_theme') || '{{ server_theme|default("light") }}';
      apply(initialRaw === 'dark' ? 'dark' : 'light');
    })();
  </script>
  {% block extra_js %}{% endblock %}
  {% block scripts %}{% endblock %}
 </body>
 </html>
