<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Workspace Hub{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <style>
    /* Shared caret & button style parity with PAM workspace */
    input, textarea, select, button, [contenteditable="true"], .form-control, .btn, body * { caret-color:#000; }
    .btn.btn-magenta { background-color:#E20074 !important; border-color:#E20074 !important; color:#fff !important; }
  </style>
  {% block extra_css %}{% endblock %}
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  {% block head %}{% endblock %}
  <style>
    html, body { height:100%; }
    body { display:flex; flex-direction:column; margin:0; }
    .hub-main { flex:1 0 auto; width:100%; }
    .global-header { background:var(--tmobile-magenta); color:#fff; padding:.75rem 1.75rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 4px rgba(0,0,0,.15); }
    .global-header-title { font-size:1.25rem; font-weight:600; letter-spacing:.5px; }
    .global-header-user { font-size:.85rem; opacity:.9; }
    .footer-bar { flex-shrink:0; background:var(--tmobile-magenta); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:.5em 2em; font-size:1rem; height:60px; box-sizing:border-box; }
  </style>
</head>
<body>
  <header class="global-header">
    <div class="global-header-title">{% block header_left %}Workspace Hub{% endblock %}</div>
    <div class="global-header-user">{% block header_right %}{% endblock %}</div>
  </header>
  <main class="hub-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer-bar">
    <div id="footer-time">{{ current_datetime }}</div>
    <div style="flex:1;text-align:right;font-size:.7rem;opacity:.85;">&copy; 2025 Internal</div>
  </footer>
  <script>
    function updateFooterTime(){const el=document.getElementById('footer-time');if(!el)return;const now=new Date();const opts={weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'};el.textContent=now.toLocaleString('en-US',opts);}setInterval(updateFooterTime,1000);updateFooterTime();
  </script>
  {% block extra_js %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
