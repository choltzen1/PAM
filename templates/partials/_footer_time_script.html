<script>
  function updateFooterTime(){
    const el = document.getElementById('footer-time');
    if(!el) return;
    const now = new Date();
    const opts = {
      weekday:'long',
      year:'numeric',
      month:'long',
      day:'numeric',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit'
    };
    el.textContent = now.toLocaleString('en-US', opts);
  }
  setInterval(updateFooterTime, 1000);
  updateFooterTime();
</script>
