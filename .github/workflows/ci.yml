name: PAM CI

on:
  push:
    branches: [ cade, main, master ]
  pull_request:
    branches: [ cade, main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ODBC Driver 17 for SQL Server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg curl
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        env:
          PAM_VALIDATION_MODE: '1'
        run: pytest -q
      - name: Endpoint validator (enforce blueprint-only)
        env:
            PAM_VALIDATION_MODE: '1'
        run: python tools/validate_endpoints.py blueprint