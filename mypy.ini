[mypy]
# Gradual strictness: start permissive, tighten over time
python_version = 3.11
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true

# Exclude virtual environments, migrations, and generated files
exclude = venv|\.venv|scripts|tools

# Per-module overrides (relax for third-party stubs we don't control)
[mypy-flask.*]
ignore_missing_imports = true

[mypy-sqlalchemy.*]
ignore_missing_imports = true

[mypy-pyodbc.*]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-oracledb.*]
ignore_missing_imports = true
